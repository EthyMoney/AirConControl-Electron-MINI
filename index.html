<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Air Conditioner Controller</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div class="container">
    <div class="status-bar">
      <div id="outside-temperature">waiting</div>
      <div id="current-time"></div>
      <div class="status-bar-end">
        <span id="outside-humidity">waiting</span>
        <button class="system-power-button hidden" id="systemPowerButton" type="button" aria-label="Raspberry Pi power options" title="Raspberry Pi power options">&#x23FB;</button>
      </div>
    </div>
    <h1 class="title">Shop Climate Control</h1>

    <div class="status-section">
      <div class="status-heading-row">
        <h2>Status</h2>
        <div class="status-problems hidden" id="statusProblemIndicators" aria-live="polite"></div>
        <button class="status-details-toggle" id="statusDetailsToggleButton" aria-label="Show detailed status" aria-expanded="false" aria-controls="statusDetailsPanel" title="Show detailed status"></button>
      </div>
      <div class="status-details-panel hidden" id="statusDetailsPanel" role="region" aria-label="Detailed system status" aria-hidden="true">
        <div class="status-details-header">
          <strong>System status</strong>
          <span id="statusDetailsIdentity"></span>
        </div>
        <div class="status-details-list">
          <div class="status-detail-row">
            <span class="health-icon health-muted" id="mqttHealthIcon" role="img" aria-label="MQTT starting">↕</span>
            <span class="status-detail-text" id="mqttHealthDetail">MQTT starting</span>
          </div>
          <div class="status-detail-row">
            <span class="health-icon health-muted" id="telemetryHealthIcon" role="img" aria-label="Telemetry waiting">◷</span>
            <span class="status-detail-text" id="telemetryHealthDetail">Telemetry waiting</span>
          </div>
          <div class="status-detail-row">
            <span class="health-icon health-muted" id="homeAssistantHealthIcon" role="img" aria-label="Home Assistant starting">⌂</span>
            <span class="status-detail-text" id="homeAssistantHealthDetail">Home Assistant starting</span>
          </div>
          <div class="status-detail-row">
            <span class="health-icon health-muted" id="runtimeSyncHealthIcon" role="img" aria-label="Runtime history local">↻</span>
            <span class="status-detail-text" id="runtimeSyncHealthDetail">Runtime history local</span>
          </div>
          <div class="status-detail-row">
            <span class="health-icon health-muted" id="storageHealthIcon" role="img" aria-label="Storage starting">▣</span>
            <span class="status-detail-text" id="storageHealthDetail">Storage starting</span>
          </div>
        </div>
      </div>
      <div class="status-runtime" id="statusRuntimeLabel"></div>
      <button class="status-runtime-info-button" id="statusRuntimeInfoButton">i</button>
      <div class="status-hardware-lights">
        <div class="status-hardware-item">
          <span class="status-light" id="fanStatusLight"></span>
          <span>Fan</span>
        </div>
        <div class="status-hardware-item">
          <span class="status-light" id="compressorStatusLight"></span>
          <span>Comp</span>
        </div>
      </div>
      <div class="status-value" id="currentStatusLabel">Not Connected!</div>
      <div class="status-command" id="commandStatusLabel"></div>
    </div>

    <div class="main-section">
      <div class="temperature-section">
        <div class="temperature-label">Setting</div>
        <div class="temperature-value" id="setTemp">-</div>
        <div class="temperature-buttons">
          <button id="tempDecreaseButton" class="decrease">-</button>
          <button id="tempIncreaseButton" class="increase">+</button>
        </div>
      </div>
      <div class="temperature-section">
        <div class="temperature-label">Current</div>
        <div class="temperature-value" id="currentTemp">-</div>
      </div>
    </div>

    <div class="control-buttons">
      <button id="powerOnButton">Power On</button>
      <button id="powerOffButton">Power Off</button>
    </div>

    <div class="system-power-dialog hidden" id="systemPowerDialog" role="dialog" aria-modal="true" aria-labelledby="systemPowerDialogTitle" aria-hidden="true">
      <div class="system-power-card">
        <div class="system-power-icon" aria-hidden="true">&#x23FB;</div>
        <h2 id="systemPowerDialogTitle">Raspberry Pi power</h2>
        <p id="systemPowerDialogMessage">Choose what you want the display to do.</p>
        <div class="system-power-actions">
          <button id="systemRestartButton" type="button">Restart</button>
          <button class="system-shutdown-button" id="systemShutdownButton" type="button">Shut down</button>
          <button class="system-power-cancel-button" id="systemPowerCancelButton" type="button">Cancel</button>
        </div>
      </div>
    </div>

    <div class="runtime-report-screen hidden" id="runtimeReportScreen">
      <div class="runtime-report-header">
        <h2>Climate History</h2>
        <button id="runtimeReportCloseButton">Back</button>
      </div>
      <div class="runtime-report-meta" id="runtimeReportMeta"></div>
      <div class="runtime-report-list" id="runtimeReportList"></div>
      <div class="runtime-report-day-detail hidden" id="runtimeReportDayDetail">
        <div class="runtime-report-day-header">
          <h3 id="runtimeReportDayTitle"></h3>
          <div class="runtime-report-day-actions">
            <button class="selected" id="temperatureHistoryViewButton">Temp</button>
            <button id="runtimeHistoryViewButton">Runtime</button>
            <button id="runtimeReportDayBackButton">Days</button>
          </div>
        </div>
        <div class="temperature-history-chart" id="temperatureHistoryChart"></div>
        <div class="runtime-hourly-chart hidden" id="runtimeHourlyChart"></div>
      </div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>

</html>
